name: Daglig kontrol af offentlig side og søgemaskinebeskeder
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: search-growth-check
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontroller offentlige sider, links, metadata og datakilder
        run: |
          python tests/full_public_crawl.py
          python tools/check_growth_health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daglig-offentlig-kontrol
          path: test-results/
  notify:
    needs: health
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Giv besked om faktiske ændringer til IndexNow
        run: python tools/notify_search_engines.py
      - name: Gem kun kvitterede beskeder
        run: |
          if [ ! -f .github/state/indexnow.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/state/indexnow.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Gem kvittering for søgemaskinebeskeder'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soegemaskinebeskeder
          path: test-results/

