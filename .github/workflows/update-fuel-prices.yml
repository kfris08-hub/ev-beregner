name: Opdater braendstofpriser
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: site-data-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hent aktuelle standard-pumpepriser fra OK
        run: python tools/update_fuel_prices.py
      - name: Opdater samme prisgrundlag i HTML og data
        run: |
          python tools/build_car_catalog.py
          python tools/build_calculator_pages.py
      - name: Kontroller datakilde, priser, metadata og alle beregnere
        run: |
          python tests/fuel_prices.test.py
          python tests/fuel_snapshot_checks.py
          node tests/fuel_prices.test.cjs
          python tests/publication.test.py
          python tests/photo_reuse.test.py
          python tests/car_catalog.test.py
          python tests/sitemap_freshness_checks.py
          python tests/seo_checks.py
          python tests/model_photo_checks.py
          python tests/image_metadata_checks.py
          python tests/calculator_page_checks.py
          node tests/calculators.test.cjs
          node tests/calculator_math.test.cjs
          node tests/growth.test.cjs
          python tests/growth.test.py
          python tests/growth_content_checks.py
      - run: python -m pip install playwright==1.56.0
      - name: Kontroller forsiden, modelsider, egne priser og fejl
        run: python tests/fuel_browser_checks.py
      - name: Gem kontrollerede pumpepriser og sider
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fuel-prices.json data/cars.json data/model-photos.json index.html elbil/ assets/calculator-cars.json bil-data-komplet.csv sitemap.xml beregnere/ om/ .github/docs/BILLEDDÆKNING.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Opdater gennemsnit af faktiske OK-pumpepriser'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Udgiv med genforsøg og bekræft den offentlige version
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_site.py --verify data/fuel-prices.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pumpepris-kontrol
          path: test-results/


