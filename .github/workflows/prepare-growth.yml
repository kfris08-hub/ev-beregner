name: Klargør nyttige indgange og delbare beregninger
on:
  push:
    branches: [growth/organic-20261111]
permissions:
  contents: write
concurrency:
  group: prepare-growth-20261111
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0 Pillow==11.3.0
      - name: Opbyg sociale billeder, navigation og beregnere
        run: |
          python tools/build_social_cards.py
          python tools/build_car_catalog.py
          python tools/build_calculator_pages.py
      - name: Kontroller matematik, deling, kilder og metadata
        run: |
          node tests/calculators.test.cjs
          node tests/calculator_math.test.cjs
          node tests/growth.test.cjs
          python tests/growth.test.py
          python tests/growth_content_checks.py
          python tests/car_catalog.test.py
          python tests/seo_checks.py
          python tests/sitemap_freshness_checks.py
          python tests/calculator_page_checks.py
          python tests/model_photo_checks.py
          python tests/image_metadata_checks.py
          python tools/notify_search_engines.py --dry-run
      - name: Kontroller mobil, deling, diesel, egne tal og de eksisterende beregnere
        run: |
          python tests/growth_browser_checks.py
          python tests/calculator_browser_checks.py
          python tests/browser_checks.py
          python tests/full_public_flows.py
      - name: Gem kun kontrolleret generering på arbejdsgrenen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html elbil/ beregnere/ om/ sitemap.xml data/cars.json data/model-photos.json assets/calculator-cars.json assets/social/ bil-data-komplet.csv .github/docs/BILLEDDÆKNING.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Opbyg beregnersider, sociale billeder og intern navigation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vaekst-kontrol
          path: test-results/
