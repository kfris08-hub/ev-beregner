name: Opbyg resterende præcise familiekoblinger
on:
  push:
    branches: [fix/site-repairs-20261108]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - name: Opbyg og kontroller billedkoblinger
        run: |
          python tools/build_car_catalog.py
          python tools/build_calculator_pages.py
          python tests/photo_reuse.test.py
          python tests/seo_checks.py
          python tests/model_photo_checks.py
          python tests/image_metadata_checks.py
          python tests/repairs_browser_checks.py
      - name: Gem kontrolleret generering på rettelsesgrenen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cars.json data/model-photos.json index.html elbil/ assets/calculator-cars.json bil-data-komplet.csv sitemap.xml beregnere/ .github/docs/BILLEDDÆKNING.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Tilføj fem yderligere nøjagtige familiebilleder'
          git push origin "HEAD:${GITHUB_REF_NAME}"
