name: Undersøg åbne bilkilder
on:
  push:
    branches: [inspect/automatic-catalog-20261025]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent kildestruktur
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,zlib
          urls=['https://bil-portalen.dk/data/bilpriser.json','https://pricelists-api.cars4ever.eu/api/models/Model%203/retail','https://pricelists-api.cars4ever.eu/api/models/Junior/retail','https://www.bydauto.dk/modeller/byd-atto-3/pris-og-detaljer','https://store.xpeng.com/dk/configurator/NEW_G6']
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'EVBeregn-source-check/1.0 (+https://www.evberegn.dk)'})
              with urllib.request.urlopen(req,timeout=30) as r: data=r.read(3000000);content_type=r.headers.get('Content-Type')
              print('SOURCE',url,content_type,len(data))
              if 'bilpriser.json' in url:
                print('CATALOG_ZLIB',base64.b64encode(zlib.compress(data)).decode())
              elif '/api/models/' in url:
                print('API_SAMPLE',data[:15000].decode())
              else:
                import re
                print('SCRIPTS',re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',data.decode())[-8:])
                for pattern in ['application/ld+json','__NEXT_DATA__','16.4','382','470','Standard Range']:
                  at=data.decode().find(pattern);print('HIT',pattern,data.decode()[max(0,at-100):at+700] if at>=0 else 'missing')
            except Exception as e:print('SOURCE_ERROR',url,type(e).__name__,str(e))
          PY
