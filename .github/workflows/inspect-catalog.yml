name: Undersøg åbne bilkilder
on:
  push:
    branches: [inspect/automatic-catalog-20261025]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Undersøg kilde-API
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,zlib
          urls=['https://pricelists-api.cars4ever.eu/swagger/v1/swagger.json','https://pricelists-api.cars4ever.eu/api/models','https://pricelists-api.cars4ever.eu/api/brands','https://pricelists-api.cars4ever.eu/api/models/Junior/retail','https://bil-portalen.dk/bil/alpine/a290','https://www.alfaromeo.dk/modeller/junior-elettrica']
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'EVBeregn-source-check/1.0 (+https://www.evberegn.dk)'})
              with urllib.request.urlopen(req,timeout=20) as r:data=r.read(4000000);ctype=r.headers.get('Content-Type')
              print('SOURCE',url,ctype,len(data))
              if '/api/models/Junior/' in url or url.endswith('.json') or url.endswith('/api/models') or url.endswith('/api/brands'):
                try:
                  d=json.loads(data)
                  if '/swagger/' in url:print('SWAGGER',json.dumps(d)[:35000])
                  else:print('API_ZLIB',url,base64.b64encode(zlib.compress(data)).decode())
                except ValueError: print('NOT_JSON')
              else:
                import re
                t=data.decode()
                for pattern in ['application/ld+json','cars4ever','Forbrug','kWh','api/']:
                  at=t.find(pattern);print('HIT',pattern,t[max(0,at-100):at+1100] if at>=0 else 'missing')
            except Exception as e:print('SOURCE_ERROR',url,type(e).__name__,str(e))
          PY
