name: Undersøg åbne bilkilder
on:
  push:
    branches: [inspect/automatic-catalog-20261025]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - name: Afprøv producenternes offentlige variantlister
        run: |
          python3 - <<'PY'
          import urllib.request,json,concurrent.futures,base64,zlib
          def probe(code):
            try:
              url='https://pricelists-api.cars4ever.eu/api/models/'+urllib.parse.quote(code,safe='')+'/retail'
              with urllib.request.urlopen(url,timeout=15) as r:data=r.read(3000000)
              d=json.loads(data);ev=[e for e in d.get('engines',[]) if e.get('fuelType')=='el']
              print('API',code,d.get('name'),len(d.get('variants',[])),len(ev))
              if ev:print('API_ZLIB',code,base64.b64encode(zlib.compress(data)).decode())
            except Exception as e:print('API_ERROR',code,str(e))
          import urllib.parse
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(probe,['A290','A390','GrandePanda','500e','e-C3','C3','e-208','208','e-2008','2008','Corsa','EV3','G6','Inster','Megane','Scenic','R5','R4']))
          PY
