name: Kontroller og klargør de resterende modelrettelser
on:
  push:
    branches: [fix/resolve-remaining-models-2026-10-24]
    paths: [.github/research/resolve_models.py, .github/research/remaining-reviewed-pins.json, .github/workflows/resolve-models.yml, tests/**, tools/render_model_photos.py, assets/model-calculator.js]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0 playwright==1.56.0
      - name: Ret de gennemgåede modelnavne og gem billederne lokalt
        run: |
          python .github/research/resolve_models.py
          python tools/render_model_photos.py
      - name: Kontroller metadata, modelvalg, billedrettigheder og alle beregnere
        run: |
          python tests/seo_checks.py
          python tests/model_photo_checks.py
          node tests/calculators.test.cjs
      - name: Kontroller alle modeller og beregnere i Chrome
        run: |
          python tests/photo_browser_checks.py
          python tests/browser_checks.py
      - name: Gem den testede udgave
        run: |
          git config user.name 'EV Beregner modelkontrol'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html elbil bil-data-komplet.csv assets/cars data .github/docs .github/research/previous-model-records.json sitemap.xml
          git commit -m 'Bekræft resterende modelnavne, tilføj fire billeder og udtag ubekræftede varianter'
          git push origin HEAD:fix/resolve-remaining-models-2026-10-24
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resterende-modelkontrol
          path: test-results/
