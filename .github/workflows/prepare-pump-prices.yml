name: Klargør faktiske pumpepriser
on:
  push:
    branches: [fix/pump-prices-20261105]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hent aktuelle pumpepriser og opbyg alle sider
        run: |
          python tools/update_fuel_prices.py
          python tools/build_car_catalog.py
          python tools/build_calculator_pages.py
      - name: Kontroller kilde, data, metadata og alle 20 beregnere
        run: |
          python tests/fuel_prices.test.py
          node tests/fuel_prices.test.cjs
          python tests/car_catalog.test.py
          python tests/sitemap_freshness_checks.py
          python tests/seo_checks.py
          python tests/model_photo_checks.py
          python tests/image_metadata_checks.py
          python tests/calculator_page_checks.py
          node tests/calculators.test.cjs
          node tests/calculator_math.test.cjs
      - run: python -m pip install playwright==1.56.0
      - name: Kontroller pumpepriser og egne priser på mobil og desktop
        run: python tests/fuel_browser_checks.py
      - name: Gem godkendte prisdata og statiske regneeksempler
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fuel-prices.json data/cars.json data/model-photos.json index.html elbil/ assets/calculator-cars.json bil-data-komplet.csv sitemap.xml beregnere/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Brug faktiske OK-pumpepriser i fælles data og alle modelsider'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pumpepris-kontrol
          path: test-results/
