name: Prepare free Danish animated dialogue
on:
  push:
    branches: [marketing/facebook-20261113]
    paths:
      - marketing/animated-20261115/generate_voice.py
      - .github/workflows/animated-dialogue-voice.yml
permissions:
  contents: write
concurrency:
  group: animated-dialogue-20261115
  cancel-in-progress: false
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free speech dependencies
        run: |
          python -m pip install piper-tts==1.3.0
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate dialogue offline
        run: python marketing/animated-20261115/generate_voice.py
      - name: Save speech and timings on the marketing branch only
        run: |
          git config user.name "EV Beregner media"
          git config user.email "media@users.noreply.github.com"
          git add marketing/animated-20261115/voice-output/dialogue.mp3 marketing/animated-20261115/voice-output/TIMELINE.json marketing/animated-20261115/voice-output/MODEL_CARD
          git commit -m "Save free Danish speech and measured dialogue timings"
          git pull --rebase origin marketing/facebook-20261113
          git push origin HEAD:marketing/facebook-20261113
