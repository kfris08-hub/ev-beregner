name: Verify published Metricool integration
on:
  push:
    branches: [verify/metricool-public-20261114]
    paths: ['.github/workflows/metricool-public.yml', 'verification/metricool_public.py']
permissions:
  contents: read
jobs:
  public-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - name: Verify live pages, consent and attribution without real tracking events
        run: python verification/metricool_public.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-metricool-check
          path: test-results/
          retention-days: 14
