name: Undersøg IndexNow-ejerskab og 403
on:
  push:
    branches: [diagnose/indexnow-20261112]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Læs ejerskabsfil og præcist svar fra IndexNow
        run: python tools/diagnose_indexnow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexnow-diagnose
          path: test-results/
