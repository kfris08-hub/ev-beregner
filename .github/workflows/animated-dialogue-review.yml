name: Review Danish dialogue pronunciation
on:
  push:
    branches: [marketing/facebook-20261113]
    paths:
      - marketing/animated-20261115/review_voice.py
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent speech recognition
        run: python -m pip install faster-whisper==1.2.1
      - name: Transcribe the new speech without a script prompt
        run: python marketing/animated-20261115/review_voice.py
      - name: Save recognition review on marketing branch
        run: |
          git config user.name "EV Beregner media"
          git config user.email "media@users.noreply.github.com"
          git add marketing/animated-20261115/voice-v2/ASR-REVIEW.json
          git commit -m "Record independent Danish transcription for voice revision"
          git pull --rebase origin marketing/facebook-20261113
          git push origin HEAD:marketing/facebook-20261113
