name: Klargør rettelser uden at ændre hjemmesiden
on:
  push:
    branches: [fix/site-repairs-20261108]
permissions:
  contents: write
concurrency:
  group: prepare-site-repairs-20261108
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.56.0 Pillow==11.3.0
      - name: Importér de visuelt kontrollerede fotografier
        run: python tools/import_reviewed_photos.py
      - name: Hent variantdata og opbyg sider
        run: |
          python tools/update_fuel_prices.py
          python tools/update_car_catalog.py
          python tools/build_car_catalog.py
          python tools/build_calculator_pages.py
      - name: Kontroller kildekoblinger, metadata, billeder og formler
        run: |
          python tests/publication.test.py
          python tests/photo_reuse.test.py
          python tests/car_catalog.test.py
          python tests/fuel_prices.test.py
          python tests/fuel_snapshot_checks.py
          python tests/sitemap_freshness_checks.py
          python tests/seo_checks.py
          python tests/model_photo_checks.py
          python tests/image_metadata_checks.py
          python tests/calculator_page_checks.py
          node tests/fuel_prices.test.cjs
          node tests/calculators.test.cjs
          node tests/calculator_math.test.cjs
      - name: Kontroller prisangivelse, egne priser, mobil og gamle adresser
        run: |
          python tests/repairs_browser_checks.py
          python tests/full_public_flows.py
          python tests/historical_browser_checks.py
      - name: Gem kun kontrollerede ændringer på rettelsesgrenen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cars.json data/fuel-prices.json data/car-update-status.json data/model-photos.json index.html elbil/ assets/calculator-cars.json assets/cars/ bil-data-komplet.csv sitemap.xml beregnere/ .github/docs/BILLEDDÆKNING.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Opbyg kontrollerede priser, modelbilleder og nye beregningssider'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kontrollerede-rettelser
          path: test-results/
