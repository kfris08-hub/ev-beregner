name: Undersøg resterende modelnavne og billeder
on:
  push:
    branches: [research/remaining-model-identities-2026-10-24]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python .github/research/remaining_photos.py
      - name: Gem kildeoplysninger på undersøgelsesgrenen
        run: |
          git config user.name 'EV Beregner modelkontrol'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/research/remaining/candidates.json
          git commit -m 'Gem undersøgte billedkilder for de sidste modeller'
          git push origin HEAD:research/remaining-model-identities-2026-10-24
