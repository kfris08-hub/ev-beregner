name: Undersøg PDF på mobilklienter og adresser
on:
  push:
    branches: [verify/mobile-pdf-20261112]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python tools/diagnose_print_clients.py
