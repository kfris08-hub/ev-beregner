name: Installer EV Beregner 4.1

on:
  push:
    paths:
      - 'EV_Beregner_4_1_RIGTIGE_BILBILLEDER.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Fjern gamle modelsider og data
        run: |
          rm -rf elbil
          rm -rf data

      - name: Pak EV Beregner 4.1 ud
        run: unzip -o EV_Beregner_4_1_RIGTIGE_BILBILLEDER.zip

      - name: Gem hjemmesiden
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A \
            index.html \
            sitemap.xml \
            robots.txt \
            CNAME \
            elbil \
            data \
            bil-data-komplet.csv
