name: Installer EV Beregner KONTROLLERET

on:
  push:
    paths:
      - 'EV_Beregner_SAMLET_KONTROLLERET.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Fjern gamle modelsider
        run: rm -rf elbil

      - name: Pak den nye hjemmeside ud
        run: unzip -o EV_Beregner_SAMLET_KONTROLLERET.zip

      - name: Gem den nye hjemmeside
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html sitemap.xml robots.txt CNAME elbil
          git diff --cached --quiet && echo "Ingen ændringer" && exit 0
          git commit -m "Opdater EV Beregner med kontrollerede bildata"
          git push
