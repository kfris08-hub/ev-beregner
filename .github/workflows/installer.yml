name: Installer EV Beregner KOMPLET

on:
  push:
    paths:
      - 'EV_Beregner_KOMPLET_2026-10-03.zip'

permissions:
  contents: write

jobs:
  installer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Pak hjemmesiden ud
        run: unzip -o EV_Beregner_KOMPLET_2026-10-03.zip

      - name: Gem de udpakkede filer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml robots.txt CNAME elbil
          git commit -m "Opdater EV Beregner med komplet bildatabase" || exit 0
          git push
