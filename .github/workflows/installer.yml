name: Kontroller eksisterende EV Beregner

# Source files are published directly. Reinstalling an old ZIP can undo fixes.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kontroller de aktuelle sider
        run: python3 tests/seo_checks.py
      - name: Kontroller alle 20 beregnere
        run: node tests/calculators.test.cjs
