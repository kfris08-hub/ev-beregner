name: Installer EV Beregner 2.0

on:
  push:
    paths:
      - 'EV_Beregner_2_0_INSTALLER.zip'

permissions:
  contents: write

jobs:
  installer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Pak hjemmesiden ud
        run: unzip -o EV_Beregner_2_0_INSTALLER.zip -d .

      - name: Gem de udpakkede filer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml robots.txt CNAME elbil
          git commit -m "Installer EV Beregner 2.0 med 186 bilsider" || exit 0
          git push
