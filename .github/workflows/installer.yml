name: Installer EV Beregner 4.6

on:
  push:
    paths:
      - 'EV_Beregner_4_6_RIGTIG_GENERATION.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Fjern gammel version
        run: |
          rm -rf elbil
          rm -rf data

      - name: Pak EV Beregner 4.6 ud
        run: |
          unzip -o EV_Beregner_4_6_RIGTIG_GENERATION.zip

      - name: Kontroller modelsider
        run: |
          COUNT=$(find elbil -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          echo "Antal modelsider: $COUNT"

          if [ "$COUNT" -ne 186 ]; then
            echo "FEJL: Der skal være 186 modelsider."
            exit 1
          fi

      - name: Gem EV Beregner 4.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A \
            index.html \
            sitemap.xml \
            robots.txt \
            CNAME \
            elbil \
            data \
            bil-data-komplet.csv \
            favicon.ico \
            favicon-48x48.png \
            favicon-192x192.png \
            favicon-512x512.png \
            apple-touch-icon.png \
            BILLEDER-4.6.txt

          git diff --cached --quiet && echo "Ingen ændringer" && exit 0

          git commit -m "EV Beregner 4.6 - korrekt bilgeneration"
          git push
