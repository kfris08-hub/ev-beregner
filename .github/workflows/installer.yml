name: Installer EV Beregner 4.3

on:
  push:
    paths:
      - 'EV_Beregner_4_3_PROFILBILLEDER.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Fjern gamle modelsider og data
        run: |
          rm -rf elbil
          rm -rf data

      - name: Pak EV Beregner 4.3 ud
        run: unzip -o EV_Beregner_4_3_PROFILBILLEDER.zip

      - name: Gem hjemmesiden
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A \
            index.html \
            sitemap.xml \
            robots.txt \
            CNAME \
            elbil \
            data \
            bil-data-komplet.csv \
            favicon.ico \
            favicon-48x48.png \
            favicon-192x192.png \
            favicon-512x512.png \
            apple-touch-icon.png

          git diff --cached --quiet && echo "Ingen ændringer" && exit 0

          git commit -m "EV Beregner 4.3 - bedre profilbilleder"
          git push
