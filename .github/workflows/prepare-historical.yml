name: Klargør tidligere bilmodeller
on:
  push:
    branches: [fix/historical-models]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Byg fælles katalog og sider
        run: |
          python tools/build_car_catalog.py
          python tools/build_calculator_pages.py
      - name: Kontroller metadata, data og alle beregnere
        run: |
          python tests/car_catalog.test.py
          python tests/seo_checks.py
          python tests/model_photo_checks.py
          python tests/image_metadata_checks.py
          python tests/calculator_page_checks.py
          node tests/calculators.test.cjs
          node tests/calculator_math.test.cjs
      - name: Installer browserkontrol
        run: python -m pip install playwright==1.56.0
      - name: Afprøv historiske biler i Chrome
        run: python tests/historical_browser_checks.py
      - name: Gem de kontrollerede modelsider
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cars.json data/model-photos.json index.html elbil/ bil-data-komplet.csv assets/calculator-cars.json sitemap.xml beregnere/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Tilføj Kia e-Soul og opbyg bilvalg, beregnere og sitemap'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historiske-biler
          path: test-results/
